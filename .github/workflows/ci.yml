name: Frontend CI

on:
  push:
  pull_request:

jobs:
  extension:
    name: Test extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run crypto contract tests
        run: npm test
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json'));"
